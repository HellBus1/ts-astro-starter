<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid decoration lines -->
  <line x1="0" y1="120" x2="1200" y2="120" stroke="#334155" stroke-opacity="0.3" stroke-width="1" />
  <line x1="0" y1="510" x2="1200" y2="510" stroke="#334155" stroke-opacity="0.3" stroke-width="1" />
  <line x1="120" y1="0" x2="120" y2="630" stroke="#334155" stroke-opacity="0.3" stroke-width="1" />
  <line x1="1080" y1="0" x2="1080" y2="630" stroke="#334155" stroke-opacity="0.3" stroke-width="1" />

  <!-- Badge -->
  <rect x="140" y="160" width="220" height="42" rx="21" fill="#312E81" />
  <text x="250" y="187" fill="#C7D2FE" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" text-anchor="middle">ASTRO + TYPESCRIPT</text>

  <!-- Title -->
  <text x="140" y="275" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">Production-Ready Starter</text>

  <!-- Subtitle -->
  <text x="140" y="340" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400">Zero-JS default • Design tokens • Strict typing • Accessibility &amp; SEO</text>

  <!-- Accent underline bar -->
  <rect x="140" y="390" width="160" height="6" rx="3" fill="url(#accent)" />

  <!-- Footer branding -->
  <text x="140" y="475" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500">github.com/syubbanfakhriya/ts-astro-starter</text>
</svg>
